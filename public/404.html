<!DOCTYPE html>
<script>
  // GitHub Pages SPA redirect trick
  var repo = '/workout/';
  var pathSegmentsToKeep = 1;

  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    repo +
    l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/') + 
    l.search + l.hash
  );
</script>
